<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCRM - CSAT & NPS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">SmartCRM</p>
            <h2>CSAT / NPS</h2>
          </div>
        </div>

        <nav class="side-nav">
          <a class="active" href="/">Tổng quan</a>
          <a href="/survey/list">Danh sách</a>
          <a href="/#reportSection">Báo cáo</a>
          <a href="/operations">Quản lý phiếu / trung tâm</a>
        </nav>

        <div class="status-box">
          <span class="dot"></span>
          Hệ thống đang hoạt động
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Dashboard</p>
            <h1>Smart CRM - L8 CSAT & NPS</h1>
          </div>
          <div class="topbar-actions">
            <div class="current-user"><strong id="currentUserName"></strong><small id="currentUserRole"></small></div>
            <button class="secondary-btn" id="logoutButton" type="button">Đăng xuất</button>
          </div>
        </header>

        <section class="metrics-grid" id="overview">
          <article class="metric-card accent-blue">
            <span class="label">Tổng phiếu</span>
            <strong id="totalSurveys">0</strong>
            <small>Phiếu khảo sát</small>
          </article>
          <article class="metric-card accent-green">
            <span class="label">CSAT trung bình</span>
            <strong id="avgCsat">0.0</strong>
            <small>/ 5 điểm</small>
          </article>
          <article class="metric-card accent-orange">
            <span class="label">NPS trung bình</span>
            <strong id="avgNps">—</strong>
            <small>/ 10 điểm</small>
          </article>
          <article class="metric-card accent-purple">
            <span class="label">Tỷ lệ hài lòng</span>
            <strong id="happyRate">0%</strong>
            <small>CSAT ≥ 4</small>
          </article>
        </section>

        <section class="panel report-panel" id="reportSection">
          <div class="panel-header">
            <h3>Báo cáo đánh giá khách hàng</h3>
          </div>
          <div id="reportInsights" class="report-grid"></div>
          <p id="statusBadge" class="badge" role="status" aria-live="polite">Đang tải...</p>
        </section>
      </main>
    </div>

    <script src="/internal.js"></script>
    <script src="/app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khách hàng đăng nhập | SmartCRM</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-brand-panel customer-brand-panel">
        <a class="login-brand" href="/login">
          <span class="brand-mark">S</span>
          <span>MEKONG MOBILE<br /><strong>SMARTCRM</strong></span>
        </a>
        <div class="login-brand-copy">
          <p class="login-eyebrow">Ý KIẾN CỦA BẠN · L8</p>
          <h1>Chia sẻ trải nghiệm của bạn.</h1>
          <p>Phản hồi của bạn giúp chúng tôi phục vụ tốt hơn.</p>
        </div>
        <div class="login-brand-foot">KHẢO SÁT CSAT / NPS <span>2026</span></div>
      </section>
      <section class="login-main">
        <div class="login-panel">
          <p class="login-eyebrow">CỔNG KHÁCH HÀNG</p>
          <h2>Chào mừng trở lại</h2>
          <p class="login-subtitle">Đăng nhập để gửi đánh giá dịch vụ</p>
          <form id="customerLoginForm" class="login-form">
            <label for="customerEmail">Email</label>
            <input id="customerEmail" name="email" type="email" autocomplete="email" placeholder="ban@example.com" required />
            <label for="customerPassword">Mật khẩu</label>
            <input id="customerPassword" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required />
            <p id="customerAuthError" class="login-error" role="alert" aria-live="polite"></p>
            <button class="login-submit" type="submit">Đăng nhập <span aria-hidden="true">→</span></button>
          </form>
          <p class="customer-entry">Chưa có tài khoản? <a href="/customer/register">Đăng ký khách hàng</a></p>
          <p class="customer-entry"><a href="/login">← Quay lại đăng nhập nội bộ</a></p>
        </div>
      </section>
    </main>
    <script src="/customer-auth.js"></script>
  </body>
</html>
